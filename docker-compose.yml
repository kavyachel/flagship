version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flagship-postgres
    environment:
      POSTGRES_USER: flagship
      POSTGRES_PASSWORD: flagship_dev
      POSTGRES_DB: flagship
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagship -d flagship"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
